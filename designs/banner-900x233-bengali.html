<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=900">
<title>আইপিএল টুর্নামেন্ট ব্যানার 900x233</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600;700;800&family=Oswald:wght@500;700&family=Noto+Sans+Bengali:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 900px;
    height: 233px;
    overflow: hidden;
    background: #050a05;
    font-family: 'Noto Sans Bengali', 'Hind Siliguri', sans-serif;
  }

  .banner {
    position: relative;
    width: 900px;
    height: 233px;
    background: linear-gradient(135deg, #050a05 0%, #0a1a0a 30%, #0d200d 50%, #0a1a0a 70%, #050a05 100%);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Scanline overlay */
  .scanlines {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0, 0, 0, 0.15) 2px,
      rgba(0, 0, 0, 0.15) 4px
    );
    z-index: 10;
    pointer-events: none;
  }

  /* Vignette */
  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.7) 100%);
    z-index: 9;
    pointer-events: none;
  }

  /* Animated green glow left */
  .glow-left {
    position: absolute;
    left: -60px;
    top: -40px;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(122,201,67,0.25) 0%, transparent 70%);
    animation: pulseGlow 3s ease-in-out infinite;
    z-index: 1;
  }

  /* Animated gold glow right */
  .glow-right {
    position: absolute;
    right: -40px;
    top: -60px;
    width: 280px;
    height: 280px;
    background: radial-gradient(circle, rgba(255,215,0,0.2) 0%, transparent 70%);
    animation: pulseGlow 3s ease-in-out infinite 1.5s;
    z-index: 1;
  }

  /* Center glow */
  .glow-center {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 500px;
    height: 200px;
    background: radial-gradient(ellipse, rgba(122,201,67,0.1) 0%, transparent 70%);
    animation: pulseGlow 4s ease-in-out infinite 0.5s;
    z-index: 1;
  }

  @keyframes pulseGlow {
    0%, 100% { opacity: 0.6; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.1); }
  }

  .glow-center {
    animation: pulseGlowCenter 4s ease-in-out infinite 0.5s;
  }

  @keyframes pulseGlowCenter {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  /* Light streaks */
  .streak {
    position: absolute;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(122,201,67,0.4), transparent);
    z-index: 2;
    animation: streakMove 4s linear infinite;
  }

  .streak-1 { top: 40px; left: 0; width: 300px; animation-delay: 0s; }
  .streak-2 { top: 120px; left: 200px; width: 400px; animation-delay: 1s; }
  .streak-3 { top: 190px; left: 100px; width: 250px; animation-delay: 2s; }
  .streak-4 { top: 70px; left: 500px; width: 350px; animation-delay: 0.5s; background: linear-gradient(90deg, transparent, rgba(255,215,0,0.3), transparent); }

  @keyframes streakMove {
    0% { opacity: 0; transform: translateX(-50px); }
    20% { opacity: 1; }
    80% { opacity: 1; }
    100% { opacity: 0; transform: translateX(50px); }
  }

  /* Decorative cricket stumps left */
  .stumps {
    position: absolute;
    left: 30px;
    bottom: 20px;
    z-index: 3;
    opacity: 0.15;
  }

  .stump {
    display: inline-block;
    width: 4px;
    height: 50px;
    background: linear-gradient(180deg, #FFD700, #B8860B);
    margin: 0 3px;
    border-radius: 2px;
  }

  .bail {
    width: 20px;
    height: 3px;
    background: #FFD700;
    margin-bottom: 2px;
    border-radius: 2px;
    margin-left: 2px;
  }

  /* Cricket ball right */
  .cricket-ball {
    position: absolute;
    right: 50px;
    bottom: 30px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #cc3333, #8b0000);
    opacity: 0.2;
    z-index: 3;
    animation: ballSpin 6s linear infinite;
  }

  .cricket-ball::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 5px;
    right: 5px;
    height: 2px;
    background: #fff;
    border-radius: 50%;
    transform: translateY(-50%) rotate(-10deg);
  }

  @keyframes ballSpin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* Trophy icon */
  .trophy {
    position: absolute;
    left: 70px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 5;
    filter: drop-shadow(0 0 20px rgba(255,215,0,0.4));
    animation: trophyFloat 3s ease-in-out infinite;
  }

  .trophy-icon {
    font-size: 64px;
    color: #FFD700;
    text-shadow: 0 0 30px rgba(255,215,0,0.5), 0 0 60px rgba(255,215,0,0.2);
  }

  @keyframes trophyFloat {
    0%, 100% { transform: translateY(-50%) translateY(0px); }
    50% { transform: translateY(-50%) translateY(-6px); }
  }

  /* Main content */
  .content {
    position: relative;
    z-index: 8;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding-left: 60px;
  }

  /* Badge */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: linear-gradient(135deg, rgba(122,201,67,0.2), rgba(122,201,67,0.05));
    border: 1px solid rgba(122,201,67,0.3);
    padding: 4px 16px;
    border-radius: 100px;
    font-size: 12px;
    font-weight: 700;
    color: #7AC943;
    letter-spacing: 1px;
    animation: badgePulse 2s ease-in-out infinite;
  }

  .badge-dot {
    width: 6px;
    height: 6px;
    background: #7AC943;
    border-radius: 50%;
    animation: dotPulse 1.5s ease-in-out infinite;
  }

  @keyframes badgePulse {
    0%, 100% { box-shadow: 0 0 10px rgba(122,201,67,0.1); }
    50% { box-shadow: 0 0 20px rgba(122,201,67,0.3); }
  }

  @keyframes dotPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* Title */
  .title {
    font-family: 'Noto Sans Bengali', 'Hind Siliguri', sans-serif;
    font-size: 52px;
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: 2px;
    background: linear-gradient(135deg, #ffffff 0%, #FFD700 40%, #FFA500 60%, #FFD700 100%);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 2px 10px rgba(255,215,0,0.3));
    animation: shimmer 3s ease-in-out infinite;
  }

  @keyframes shimmer {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* Subtitle */
  .subtitle {
    font-family: 'Noto Sans Bengali', 'Hind Siliguri', sans-serif;
    font-size: 15px;
    font-weight: 500;
    color: #9ca3af;
    letter-spacing: 2px;
  }

  /* Prize info */
  .prize-row {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-top: 2px;
  }

  .prize-tag {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'Noto Sans Bengali', 'Hind Siliguri', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: #7AC943;
    text-shadow: 0 0 10px rgba(122,201,67,0.3);
  }

  .prize-tag .icon {
    font-size: 16px;
  }

  .divider-dot {
    width: 4px;
    height: 4px;
    background: rgba(255,255,255,0.2);
    border-radius: 50%;
  }

  .join-tag {
    font-family: 'Noto Sans Bengali', 'Hind Siliguri', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: #FFD700;
    letter-spacing: 1px;
    text-shadow: 0 0 10px rgba(255,215,0,0.3);
    animation: joinPulse 2s ease-in-out infinite;
  }

  @keyframes joinPulse {
    0%, 100% { opacity: 0.8; }
    50% { opacity: 1; }
  }

  /* Borders top & bottom */
  .border-top, .border-bottom {
    position: absolute;
    left: 0;
    right: 0;
    height: 2px;
    z-index: 11;
  }

  .border-top {
    top: 0;
    background: linear-gradient(90deg, transparent, #7AC943, #FFD700, #7AC943, transparent);
    animation: borderShimmer 4s linear infinite;
  }

  .border-bottom {
    bottom: 0;
    background: linear-gradient(90deg, transparent, #FFD700, #7AC943, #FFD700, transparent);
    animation: borderShimmer 4s linear infinite reverse;
  }

  @keyframes borderShimmer {
    0% { background-position: -900px 0; }
    100% { background-position: 900px 0; }
  }

  .border-top, .border-bottom {
    background-size: 900px 2px;
  }

  /* Sparkles */
  .sparkle {
    position: absolute;
    z-index: 7;
    animation: sparkle 2s ease-in-out infinite;
  }

  .sparkle::before, .sparkle::after {
    content: '';
    position: absolute;
    background: #FFD700;
  }

  .sparkle::before {
    width: 2px;
    height: 10px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
  }

  .sparkle::after {
    width: 10px;
    height: 2px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
  }

  .sparkle-1 { top: 30px; left: 200px; animation-delay: 0s; }
  .sparkle-2 { top: 80px; right: 180px; animation-delay: 0.7s; }
  .sparkle-3 { bottom: 40px; left: 350px; animation-delay: 1.4s; }
  .sparkle-4 { top: 50px; right: 300px; animation-delay: 0.3s; }
  .sparkle-5 { bottom: 60px; right: 120px; animation-delay: 1s; }

  @keyframes sparkle {
    0%, 100% { opacity: 0; transform: scale(0.5); }
    50% { opacity: 1; transform: scale(1); }
  }

  /* Floating particles via canvas */
  #particles {
    position: absolute;
    inset: 0;
    z-index: 4;
  }
</style>
</head>
<body>
<div class="banner">
  <!-- Effects layers -->
  <div class="glow-left"></div>
  <div class="glow-right"></div>
  <div class="glow-center"></div>
  <div class="scanlines"></div>
  <div class="vignette"></div>

  <!-- Light streaks -->
  <div class="streak streak-1"></div>
  <div class="streak streak-2"></div>
  <div class="streak streak-3"></div>
  <div class="streak streak-4"></div>

  <!-- Sparkles -->
  <div class="sparkle sparkle-1"></div>
  <div class="sparkle sparkle-2"></div>
  <div class="sparkle sparkle-3"></div>
  <div class="sparkle sparkle-4"></div>
  <div class="sparkle sparkle-5"></div>

  <!-- Cricket decorations -->
  <div class="stumps">
    <div class="bail"></div>
    <div style="display:flex;">
      <div class="stump"></div>
      <div class="stump"></div>
      <div class="stump"></div>
    </div>
  </div>
  <div class="cricket-ball"></div>

  <!-- Particles canvas -->
  <canvas id="particles"></canvas>

  <!-- Borders -->
  <div class="border-top"></div>
  <div class="border-bottom"></div>

  <!-- Trophy -->
  <div class="trophy">
    <div class="trophy-icon">🏆</div>
  </div>

  <!-- Main content -->
  <div class="content">
    <div class="badge">
      <span class="badge-dot"></span>
      <span>লাইভ টুর্নামেন্ট</span>
    </div>
    <div class="title">আইপিএল টুর্নামেন্ট</div>
    <div class="subtitle">সাপ্তাহিক চ্যাম্পিয়নশিপ সিরিজ</div>
    <div class="prize-row">
      <span class="prize-tag"><span class="icon">💰</span> বড় পুরস্কার</span>
      <span class="divider-dot"></span>
      <span class="prize-tag"><span class="icon">🏏</span> এখনই খেলুন</span>
      <span class="divider-dot"></span>
      <span class="join-tag">আজই যোগ দিন &rarr;</span>
    </div>
  </div>
</div>

<script>
  // Particle system
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  canvas.width = 900;
  canvas.height = 233;

  const particles = [];
  const PARTICLE_COUNT = 40;

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    particles.push({
      x: Math.random() * 900,
      y: Math.random() * 233,
      size: Math.random() * 2 + 0.5,
      speedX: (Math.random() - 0.5) * 0.5,
      speedY: (Math.random() - 0.5) * 0.3,
      opacity: Math.random() * 0.5 + 0.1,
      phase: Math.random() * Math.PI * 2,
      isGold: Math.random() > 0.6
    });
  }

  function animate() {
    ctx.clearRect(0, 0, 900, 233);
    const time = Date.now() * 0.001;

    particles.forEach(p => {
      p.x += p.speedX;
      p.y += p.speedY;
      const opacity = p.opacity * (0.5 + 0.5 * Math.sin(time + p.phase));

      if (p.x < 0) p.x = 900;
      if (p.x > 900) p.x = 0;
      if (p.y < 0) p.y = 233;
      if (p.y > 233) p.y = 0;

      const color = p.isGold ? `rgba(255,215,0,${opacity})` : `rgba(122,201,67,${opacity})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();

      // Glow
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * 3, 0, Math.PI * 2);
      ctx.fillStyle = p.isGold ? `rgba(255,215,0,${opacity * 0.15})` : `rgba(122,201,67,${opacity * 0.15})`;
      ctx.fill();
    });

    requestAnimationFrame(animate);
  }

  animate();
</script>
</body>
</html>
