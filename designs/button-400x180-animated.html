<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=400">
<title>IPL Tournament Animated Button 400x180</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 400px;
    height: 180px;
    overflow: hidden;
    background: #050a05;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .wrapper {
    position: relative;
    width: 400px;
    height: 180px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, #050a05 0%, #0a1a0a 40%, #0d200d 60%, #0a1a0a 100%);
    border-radius: 24px;
    border: 1.5px solid rgba(122,201,67,0.3);
    box-shadow: 0 0 30px rgba(122,201,67,0.15), 0 0 60px rgba(122,201,67,0.05), 0 8px 32px rgba(0,0,0,0.5);
    overflow: hidden;
  }

  /* Scanlines */
  .scanlines {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.12) 2px,
      rgba(0,0,0,0.12) 4px
    );
    z-index: 10;
    pointer-events: none;
  }

  /* Vignette */
  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.6) 100%);
    z-index: 9;
    pointer-events: none;
  }

  /* Glow effects */
  .glow-1 {
    position: absolute;
    top: -40px;
    left: -40px;
    width: 200px;
    height: 200px;
    background: radial-gradient(circle, rgba(122,201,67,0.25) 0%, transparent 70%);
    animation: pulseGlow 3s ease-in-out infinite;
    z-index: 1;
  }

  .glow-2 {
    position: absolute;
    bottom: -50px;
    right: -30px;
    width: 180px;
    height: 180px;
    background: radial-gradient(circle, rgba(255,215,0,0.2) 0%, transparent 70%);
    animation: pulseGlow 3s ease-in-out infinite 1.5s;
    z-index: 1;
  }

  .glow-center {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 300px;
    height: 150px;
    background: radial-gradient(ellipse, rgba(122,201,67,0.12) 0%, transparent 70%);
    animation: pulseGlowCenter 4s ease-in-out infinite;
    z-index: 1;
  }

  @keyframes pulseGlow {
    0%, 100% { opacity: 0.6; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.1); }
  }

  @keyframes pulseGlowCenter {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }

  /* Light streaks */
  .streak {
    position: absolute;
    height: 1px;
    z-index: 2;
    animation: streakMove 4s linear infinite;
  }

  .streak-1 {
    top: 30px; left: 0; width: 200px;
    background: linear-gradient(90deg, transparent, rgba(122,201,67,0.4), transparent);
    animation-delay: 0s;
  }
  .streak-2 {
    top: 140px; left: 100px; width: 250px;
    background: linear-gradient(90deg, transparent, rgba(255,215,0,0.3), transparent);
    animation-delay: 1.5s;
  }

  @keyframes streakMove {
    0% { opacity: 0; transform: translateX(-30px); }
    20% { opacity: 1; }
    80% { opacity: 1; }
    100% { opacity: 0; transform: translateX(30px); }
  }

  /* Borders */
  .border-top, .border-bottom {
    position: absolute;
    left: 0;
    right: 0;
    height: 2px;
    z-index: 11;
    background-size: 400px 2px;
  }

  .border-top {
    top: 0;
    background: linear-gradient(90deg, transparent, #7AC943, #FFD700, #7AC943, transparent);
    animation: borderShimmer 3s linear infinite;
  }

  .border-bottom {
    bottom: 0;
    background: linear-gradient(90deg, transparent, #FFD700, #7AC943, #FFD700, transparent);
    animation: borderShimmer 3s linear infinite reverse;
  }

  @keyframes borderShimmer {
    0% { background-position: -400px 0; }
    100% { background-position: 400px 0; }
  }

  /* Sparkles */
  .sparkle {
    position: absolute;
    z-index: 7;
    animation: sparkle 2s ease-in-out infinite;
  }

  .sparkle::before, .sparkle::after {
    content: '';
    position: absolute;
    background: #FFD700;
  }

  .sparkle::before {
    width: 2px;
    height: 8px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
  }

  .sparkle::after {
    width: 8px;
    height: 2px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
  }

  .sparkle-1 { top: 20px; left: 40px; animation-delay: 0s; }
  .sparkle-2 { top: 25px; right: 50px; animation-delay: 0.7s; }
  .sparkle-3 { bottom: 25px; left: 60px; animation-delay: 1.3s; }
  .sparkle-4 { bottom: 30px; right: 40px; animation-delay: 0.4s; }

  @keyframes sparkle {
    0%, 100% { opacity: 0; transform: scale(0.5); }
    50% { opacity: 1; transform: scale(1); }
  }

  /* Main title */
  .content {
    position: relative;
    z-index: 8;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 38px;
    line-height: 1;
    letter-spacing: 3px;
    white-space: nowrap;
    background: linear-gradient(135deg, #ffffff 0%, #FFD700 35%, #FFA500 50%, #FFD700 65%, #ffffff 100%);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 2px 12px rgba(255,215,0,0.4));
    animation: shimmer 3s ease-in-out infinite;
  }

  @keyframes shimmer {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .subtitle {
    font-family: 'Oswald', sans-serif;
    font-size: 14px;
    font-weight: 500;
    color: #7AC943;
    letter-spacing: 10px;
    text-transform: uppercase;
    text-shadow: 0 0 15px rgba(122,201,67,0.4);
    animation: subtitlePulse 2.5s ease-in-out infinite;
  }

  @keyframes subtitlePulse {
    0%, 100% { opacity: 0.7; letter-spacing: 10px; }
    50% { opacity: 1; letter-spacing: 12px; }
  }

  /* Particles canvas */
  #particles {
    position: absolute;
    inset: 0;
    z-index: 4;
  }
</style>
</head>
<body>
<div class="wrapper">
  <!-- Effects -->
  <div class="glow-1"></div>
  <div class="glow-2"></div>
  <div class="glow-center"></div>
  <div class="scanlines"></div>
  <div class="vignette"></div>

  <!-- Streaks -->
  <div class="streak streak-1"></div>
  <div class="streak streak-2"></div>

  <!-- Borders -->
  <div class="border-top"></div>
  <div class="border-bottom"></div>

  <!-- Sparkles -->
  <div class="sparkle sparkle-1"></div>
  <div class="sparkle sparkle-2"></div>
  <div class="sparkle sparkle-3"></div>
  <div class="sparkle sparkle-4"></div>

  <!-- Particles -->
  <canvas id="particles"></canvas>

  <!-- Text -->
  <div class="content">
    <div class="title">IPL TOURNAMENT</div>
    <div class="subtitle">Play &amp; Win</div>
  </div>
</div>

<script>
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  canvas.width = 400;
  canvas.height = 180;

  const particles = [];
  const COUNT = 25;

  for (let i = 0; i < COUNT; i++) {
    particles.push({
      x: Math.random() * 400,
      y: Math.random() * 180,
      size: Math.random() * 1.8 + 0.4,
      speedX: (Math.random() - 0.5) * 0.4,
      speedY: (Math.random() - 0.5) * 0.25,
      opacity: Math.random() * 0.5 + 0.1,
      phase: Math.random() * Math.PI * 2,
      isGold: Math.random() > 0.5
    });
  }

  function animate() {
    ctx.clearRect(0, 0, 400, 180);
    const time = Date.now() * 0.001;

    particles.forEach(p => {
      p.x += p.speedX;
      p.y += p.speedY;
      const op = p.opacity * (0.5 + 0.5 * Math.sin(time + p.phase));

      if (p.x < 0) p.x = 400;
      if (p.x > 400) p.x = 0;
      if (p.y < 0) p.y = 180;
      if (p.y > 180) p.y = 0;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = p.isGold ? `rgba(255,215,0,${op})` : `rgba(122,201,67,${op})`;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * 3, 0, Math.PI * 2);
      ctx.fillStyle = p.isGold ? `rgba(255,215,0,${op * 0.12})` : `rgba(122,201,67,${op * 0.12})`;
      ctx.fill();
    });

    requestAnimationFrame(animate);
  }

  animate();
</script>
</body>
</html>
