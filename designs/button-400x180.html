<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=400">
<title>IPL Tournament Button 400x180</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 400px;
    height: 180px;
    overflow: hidden;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .button-wrap {
    position: relative;
    width: 400px;
    height: 180px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border-radius: 20px;
    overflow: hidden;
  }

  .scanlines {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.12) 2px, rgba(0,0,0,0.12) 4px);
    z-index: 5;
    pointer-events: none;
    border-radius: 20px;
  }

  .glow-1 {
    position: absolute;
    top: -30px; left: -30px;
    width: 180px; height: 180px;
    background: radial-gradient(circle, rgba(122,201,67,0.2) 0%, transparent 70%);
    z-index: 1;
  }

  .glow-2 {
    position: absolute;
    bottom: -40px; right: -20px;
    width: 160px; height: 160px;
    background: radial-gradient(circle, rgba(255,215,0,0.15) 0%, transparent 70%);
    z-index: 1;
  }


  .button {
    position: relative;
    z-index: 4;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 356px;
    height: 140px;
    background: linear-gradient(135deg, #7AC943 0%, #5cb52e 50%, #4a9e24 100%);
    border-radius: 14px;
    box-shadow:
      0 0 30px rgba(122,201,67,0.4),
      0 0 60px rgba(122,201,67,0.15),
      0 8px 32px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.2),
      inset 0 -2px 0 rgba(0,0,0,0.2);
    overflow: hidden;
  }

  .button::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 60%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
    transform: skewX(-20deg);
    animation: buttonShine 4s ease-in-out infinite;
    z-index: 1;
  }

  @keyframes buttonShine {
    0%, 70%, 100% { left: -100%; }
    40% { left: 150%; }
  }

  .button::after {
    content: '';
    position: absolute;
    top: 0; left: 10%; right: 10%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
    z-index: 2;
  }

  .btn-content {
    position: relative;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    width: 320px;
  }

  .btn-title {
    font-family: 'Bebas Neue', Impact, 'Arial Narrow', sans-serif;
    font-size: 80px;
    letter-spacing: 4px;
    color: #ffffff;
    text-shadow:
      0 3px 8px rgba(0,0,0,0.5),
      0 0 40px rgba(255,255,255,0.15);
    line-height: 1;
    white-space: nowrap;
    text-align: center;
    transform-origin: center center;
  }

  .btn-subtitle {
    font-family: 'Oswald', Impact, sans-serif;
    font-size: 14px;
    font-weight: 500;
    color: rgba(255,255,255,0.85);
    letter-spacing: 6px;
    text-transform: uppercase;
    text-shadow: 0 1px 3px rgba(0,0,0,0.3);
  }

  .corner { position: absolute; width: 12px; height: 12px; z-index: 6; }
  .corner-tl { top: 8px; left: 8px; border-top: 2px solid rgba(255,215,0,0.4); border-left: 2px solid rgba(255,215,0,0.4); }
  .corner-tr { top: 8px; right: 8px; border-top: 2px solid rgba(255,215,0,0.4); border-right: 2px solid rgba(255,215,0,0.4); }
  .corner-bl { bottom: 8px; left: 8px; border-bottom: 2px solid rgba(255,215,0,0.4); border-left: 2px solid rgba(255,215,0,0.4); }
  .corner-br { bottom: 8px; right: 8px; border-bottom: 2px solid rgba(255,215,0,0.4); border-right: 2px solid rgba(255,215,0,0.4); }

</style>
</head>
<body>
<div class="button-wrap">
  <div class="button">
    <div class="btn-content">
      <span class="btn-title" id="title">IPL TOURNAMENT</span>
      <span class="btn-subtitle">Play &amp; Win Big</span>
    </div>
  </div>
</div>

<script>
  // Auto-scale title to fill 90% of button width
  function fitTitle() {
    const title = document.getElementById('title');
    const container = title.closest('.btn-content');
    const maxWidth = container.offsetWidth;
    const actualWidth = title.scrollWidth;
    if (actualWidth > maxWidth) {
      const scale = maxWidth / actualWidth;
      title.style.transform = `scaleX(${scale})`;
    }
  }
  // Run after fonts load (or fallback)
  if (document.fonts) {
    document.fonts.ready.then(fitTitle);
  } else {
    setTimeout(fitTitle, 500);
  }
  setTimeout(fitTitle, 1000);
</script>
</body>
</html>
