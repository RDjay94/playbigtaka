<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=400">
<title>IPL Tournament Button 400x180</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@600;700;800&family=Oswald:wght@500;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 400px;
    height: 180px;
    overflow: hidden;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .button-wrap {
    position: relative;
    width: 400px;
    height: 180px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, #050a05 0%, #0a1a0a 40%, #0d200d 60%, #0a1a0a 100%);
    border-radius: 20px;
    overflow: hidden;
  }

  /* Scanlines */
  .scanlines {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.12) 2px,
      rgba(0,0,0,0.12) 4px
    );
    z-index: 5;
    pointer-events: none;
    border-radius: 20px;
  }

  /* Glow effects */
  .glow-1 {
    position: absolute;
    top: -30px;
    left: -30px;
    width: 180px;
    height: 180px;
    background: radial-gradient(circle, rgba(122,201,67,0.2) 0%, transparent 70%);
    z-index: 1;
  }

  .glow-2 {
    position: absolute;
    bottom: -40px;
    right: -20px;
    width: 160px;
    height: 160px;
    background: radial-gradient(circle, rgba(255,215,0,0.15) 0%, transparent 70%);
    z-index: 1;
  }

  /* Outer border glow */
  .button-wrap::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 20px;
    border: 1.5px solid rgba(122,201,67,0.25);
    z-index: 6;
    pointer-events: none;
  }

  /* Inner button */
  .button {
    position: relative;
    z-index: 4;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 340px;
    height: 130px;
    background: linear-gradient(135deg, #7AC943 0%, #5cb52e 50%, #4a9e24 100%);
    border-radius: 16px;
    border: none;
    cursor: pointer;
    box-shadow:
      0 0 30px rgba(122,201,67,0.4),
      0 0 60px rgba(122,201,67,0.15),
      0 8px 32px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.2),
      inset 0 -2px 0 rgba(0,0,0,0.2);
    overflow: hidden;
  }

  /* Button shine effect */
  .button::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 60%;
    height: 100%;
    background: linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,0.15),
      transparent
    );
    transform: skewX(-20deg);
    animation: buttonShine 4s ease-in-out infinite;
    z-index: 1;
  }

  @keyframes buttonShine {
    0%, 70%, 100% { left: -100%; }
    40% { left: 150%; }
  }

  /* Top highlight */
  .button::after {
    content: '';
    position: absolute;
    top: 0;
    left: 10%;
    right: 10%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
    z-index: 2;
  }

  /* Trophy and text */
  .btn-content {
    position: relative;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }

  .btn-icon {
    font-size: 28px;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    margin-bottom: 2px;
  }

  .btn-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 38px;
    letter-spacing: 5px;
    color: #ffffff;
    text-shadow:
      0 2px 4px rgba(0,0,0,0.3),
      0 0 20px rgba(255,255,255,0.1);
    line-height: 1;
  }

  .btn-subtitle {
    font-family: 'Oswald', sans-serif;
    font-size: 12px;
    font-weight: 500;
    color: rgba(255,255,255,0.85);
    letter-spacing: 4px;
    text-transform: uppercase;
    text-shadow: 0 1px 3px rgba(0,0,0,0.3);
  }

  /* Corner accents */
  .corner {
    position: absolute;
    width: 12px;
    height: 12px;
    z-index: 6;
  }

  .corner-tl {
    top: 8px; left: 8px;
    border-top: 2px solid rgba(255,215,0,0.4);
    border-left: 2px solid rgba(255,215,0,0.4);
  }

  .corner-tr {
    top: 8px; right: 8px;
    border-top: 2px solid rgba(255,215,0,0.4);
    border-right: 2px solid rgba(255,215,0,0.4);
  }

  .corner-bl {
    bottom: 8px; left: 8px;
    border-bottom: 2px solid rgba(255,215,0,0.4);
    border-left: 2px solid rgba(255,215,0,0.4);
  }

  .corner-br {
    bottom: 8px; right: 8px;
    border-bottom: 2px solid rgba(255,215,0,0.4);
    border-right: 2px solid rgba(255,215,0,0.4);
  }

  /* Medal dots */
  .medals {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 6px;
    z-index: 6;
  }

  .medal {
    width: 5px;
    height: 5px;
    border-radius: 50%;
  }

  .medal-gold { background: #FFD700; box-shadow: 0 0 6px rgba(255,215,0,0.5); }
  .medal-silver { background: #C0C0C0; box-shadow: 0 0 6px rgba(192,192,192,0.4); }
  .medal-bronze { background: #CD7F32; box-shadow: 0 0 6px rgba(205,127,50,0.4); }
</style>
</head>
<body>
<div class="button-wrap">
  <!-- Effects -->
  <div class="glow-1"></div>
  <div class="glow-2"></div>
  <div class="scanlines"></div>

  <!-- Corner accents -->
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <!-- Medal dots at bottom -->
  <div class="medals">
    <div class="medal medal-gold"></div>
    <div class="medal medal-silver"></div>
    <div class="medal medal-bronze"></div>
  </div>

  <!-- Main button -->
  <div class="button">
    <div class="btn-content">
      <span class="btn-icon">🏏</span>
      <span class="btn-title">IPL TOURNAMENT</span>
      <span class="btn-subtitle">Play &amp; Win Big</span>
    </div>
  </div>
</div>
</body>
</html>
